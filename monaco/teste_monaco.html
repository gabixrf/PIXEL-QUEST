
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste Monaco | PIXEL QUEST</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            background: #050817;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #b58aff;
        }

        #editor {
            width: 100%;
            height: 450px;
            border: 1px solid #8c70bb;
            margin-top: 20px;
        }

        button {
            margin-top: 15px;
            padding: 12px 20px;
            background: #8c70bb;
            color: white;
            border: none;
            cursor: pointer;
        }

        #resultado {
            margin-top: 15px;
            padding: 15px;
            background: #111a32;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>PIXEL QUEST</h1>
    <p>Ambiente de teste do Monaco Editor</p>

    <h3>Exercício 01</h3>

    <p>
        Crie uma variável chamada nome com o valor
        "PIXEL QUEST" e exiba a mensagem "Olá, PIXEL QUEST!"
    </p>

    <div id="editor"></div>

    <button id="botaoExecutar" onclick="executarCodigo()">
        EXECUTAR E CORRIGIR
    </button>

    <pre id="resultado">O resultado aparecerá aqui.</pre>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs/loader.js"></script>

    <script>
        const baseUrl =
            "https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/";

        window.MonacoEnvironment = {
            getWorkerUrl: function () {
                const workerCode = `
                    self.MonacoEnvironment = {
                        baseUrl: '${baseUrl}'
                    };
                    importScripts('${baseUrl}vs/base/worker/workerMain.js');
                `;

                return "data:text/javascript;charset=utf-8," +
                    encodeURIComponent(workerCode);
            }
        };

        require.config({
            paths: {
                vs: baseUrl + "vs"
            }
        });

        let editor;

        require(["vs/editor/editor.main"], function () {

            editor = monaco.editor.create(
                document.getElementById("editor"),
                {
                    value: [
                        'nome = "PIXEL QUEST"',
                        '',
                        'print("Olá, " + nome + "!")'
                    ].join("\n"),

                    language: "python",
                    theme: "vs-dark",
                    automaticLayout: true,
                    fontSize: 15,
                    minimap: {
                        enabled: false
                    },
                    scrollBeyondLastLine: false
                }
            );

        });

        async function executarCodigo() {

            if (!editor) {
                alert("O editor ainda está carregando.");
                return;
            }

            const botao = document.getElementById("botaoExecutar");
            const resultado = document.getElementById("resultado");

            botao.disabled = true;
            botao.textContent = "EXECUTANDO...";

            resultado.textContent = "Executando código Python...";

            try {

                const resposta = await fetch("executar.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        codigo: editor.getValue()
                    })
                });

                const dados = await resposta.json();

                resultado.textContent = dados.mensagem || "Sem mensagem.";

                if (dados.saida !== undefined) {
                    resultado.textContent +=
                        "\n\nSaída:\n" + dados.saida;
                }

                if (dados.erro) {
                    resultado.textContent +=
                        "\n\nDetalhes:\n" + dados.erro;
                }

                resultado.style.color = dados.correto
                    ? "#80f0ad"
                    : "#ff9ba9";

            } catch (erro) {

                resultado.textContent =
                    "Erro ao comunicar com o servidor: " + erro.message;

                resultado.style.color = "#ff9ba9";

            } finally {

                botao.disabled = false;
                botao.textContent = "EXECUTAR E CORRIGIR";

            }
        }
    </script>

</body>
</html>
